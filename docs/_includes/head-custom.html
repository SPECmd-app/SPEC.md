<!-- Analytics with consent: Google tag (gtag.js) loads only after the visitor accepts -->
<style>
#cc-banner{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;padding:14px 16px;background:#fff;color:#1f2328;border:1px solid #d0d7de;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;z-index:9999;display:none}
#cc-banner p{margin:0 0 10px}
#cc-banner button,#cc-reopen{font:inherit;cursor:pointer;border-radius:6px;border:1px solid #d0d7de;padding:6px 14px;background:#f6f8fa;color:inherit}
#cc-banner button#cc-accept{background:#1f2328;color:#fff;border-color:#1f2328}
#cc-banner .cc-actions{display:flex;gap:8px;justify-content:flex-end}
#cc-reopen{position:fixed;left:16px;bottom:16px;padding:3px 10px;font-size:12px;opacity:.7;display:none;z-index:9998}
@media (prefers-color-scheme:dark){#cc-banner,#cc-reopen{background:#161b22;color:#e6edf3;border-color:#30363d}#cc-banner button{background:#21262d}#cc-banner button#cc-accept{background:#e6edf3;color:#0d1117;border-color:#e6edf3}}
</style>
<script>
(function(){
  var GA_ID='G-6ELH0H1RPK',KEY='specmd-analytics-consent';
  function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function loadGA(){
    if(window.__gaLoaded)return;window.__gaLoaded=true;
    var s=document.createElement('script');s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){dataLayer.push(arguments)};
    gtag('js',new Date());gtag('config',GA_ID);
  }
  function ui(){
    var b=document.createElement('div');b.id='cc-banner';b.setAttribute('role','dialog');b.setAttribute('aria-label','Analytics consent');
    b.innerHTML='<p>This site can use Google Analytics cookies. Nothing is reported unless you accept.</p><div class="cc-actions"><button id="cc-decline" type="button">Decline</button><button id="cc-accept" type="button">Accept</button></div>';
    var r=document.createElement('button');r.id='cc-reopen';r.type='button';r.textContent='Cookie settings';
    document.body.appendChild(b);document.body.appendChild(r);
    function show(){b.style.display='block';r.style.display='none'}
    function hide(){b.style.display='none';r.style.display='block'}
    b.querySelector('#cc-accept').onclick=function(){set('granted');hide();loadGA()};
    b.querySelector('#cc-decline').onclick=function(){
      var was=get();set('denied');hide();
      if(was==='granted'){location.reload()}
    };
    r.onclick=show;
    if(get()===null){show()}else{r.style.display='block'}
  }
  if(get()==='granted')loadGA();
  if(document.body)ui();else document.addEventListener('DOMContentLoaded',ui);
})();
</script>
